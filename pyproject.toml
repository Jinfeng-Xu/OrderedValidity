[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ordered-validity"
version = "1.0.0"
description = "Failure-retaining validity and dependence-aware decisions for finite molecular-generation benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jinfeng Xu"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
ordered-validity = "ordered_validity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ordered_validity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

